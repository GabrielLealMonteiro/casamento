<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pré-wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="fotos">
  <nav class="nav" id="nav"></nav>

  <section class="section top">
    <h2 id="gal-title"></h2>
    <p class="lead" id="gal-sub"></p>
    <div class="gallery" id="gallery"></div>
    <p class="small credit" id="gal-credit"></p>
  </section>
  <div class="lightbox" id="lightbox">
    <button class="lb-close" aria-label="Fechar">×</button>
    <button class="lb-prev" aria-label="Anterior">‹</button>
    <figure><img id="lb-img" alt="" /><figcaption id="lb-cap"></figcaption></figure>
    <button class="lb-next" aria-label="Próxima">›</button>
  </div>

  <footer class="footer" id="footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pix.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
